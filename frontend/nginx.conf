server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Supporto per Single Page Application (SPA) - React Router
    # Se il file o la directory non esiste, reindirizza a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statica per asset (immagini, js, css)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
